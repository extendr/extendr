name: PR Checks

on:
  pull_request:
    branches:
      - main
    paths:
      - "**.rs"
      - "**.R"
      - "**.toml"
      - "**.lock"

# Cancel previous runs when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr_tests:
    uses: ./.github/workflows/test-template.yml
    with:
      test-matrix: |
        [
          {
            "os": "windows-latest",
            "r": "release",
            "rust-version": "stable-msvc",
            "rtools-version": "44",
            "features": "full-functionality"
          },
          {
            "os": "windows-latest",
            "r": "oldrel",
            "rust-version": "stable-msvc",
            "rtools-version": "43",
            "features": "default"
          },
          {
            "os": "macOS-latest",
            "r": "release",
            "rust-version": "stable",
            "features": "full-functionality"
          },
          {
            "os": "macOS-latest",
            "r": "oldrel",
            "rust-version": "stable",
            "features": "default"
          },
          {
            "os": "ubuntu-latest",
            "r": "release",
            "rust-version": "stable",
            "features": "full-functionality",
            "check_fmt": true
          },
          {
            "os": "ubuntu-latest",
            "r": "oldrel",
            "rust-version": "stable",
            "features": "default"
          }
        ]

  # Exercises extendr-ffi's no-R fallback, used by docs.rs and rust-analyzer
  build-no-r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Ensure R is not installed
        run: |
          if command -v R >/dev/null; then
            echo "R found at $(command -v R); this job must run without R"
            exit 1
          fi

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Clippy workspace without R
        run: cargo clippy --workspace --exclude extendr-engine --all-features -- -D warnings

      - name: Document extendr-api without R
        run: cargo doc -p extendr-api --features full-functionality --no-deps

  # Call MSRV check workflow after PR tests pass
  msrv_check:
    needs: pr_tests
    uses: ./.github/workflows/msrv.yml
